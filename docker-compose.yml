version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-api-kitchen-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-8000}
      - DEBUG=${DEBUG:-True}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - WS_HEARTBEAT_INTERVAL_SECONDS=${WS_HEARTBEAT_INTERVAL_SECONDS:-15}
      - TOOL_EXECUTION_TIMEOUT_SECONDS=${TOOL_EXECUTION_TIMEOUT_SECONDS:-30}
      - MAX_TOOL_CALLS_PER_TURN=${MAX_TOOL_CALLS_PER_TURN:-10}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    volumes:
      # Live-reload mount for seamless development in Antigravity IDE
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
